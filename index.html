<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>总数据看板 v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #eef8f6;
  --panel: rgba(255,255,255,0.86);
  --text: #1f3b39;
  --muted: #6d8c89;
  --line: rgba(94, 146, 138, 0.16);
  --accent: #5daea0;
  --accent-deep: #348779;
  --shadow: 0 18px 48px rgba(90, 146, 137, 0.10);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(165, 224, 214, 0.34), transparent 28%),
    radial-gradient(circle at top right, rgba(189, 227, 255, 0.26), transparent 24%),
    linear-gradient(180deg, #f4fcfa 0%, #eef8f6 45%, #eaf5f4 100%);
}
.page-shell { max-width: 1480px; margin: 0 auto; padding: 30px 20px 64px; }
.hero-panel { display: grid; grid-template-columns: 1.7fr 1fr; gap: 18px; margin-bottom: 18px; }
.hero-copy {
  padding: 30px;
  border-radius: 30px;
  background: linear-gradient(135deg, rgba(92, 177, 162, 0.94), rgba(116, 199, 187, 0.88));
  color: #f8fffe;
  box-shadow: var(--shadow);
}
.hero-copy h1 { margin: 0; font-size: clamp(32px, 4vw, 56px); line-height: 1.06; font-family: 'Noto Sans SC', sans-serif; }
.hero-text { margin: 18px 0 0; font-size: 16px; line-height: 1.72; color: rgba(248, 255, 254, 0.94); }
.eyebrow, .panel-kicker { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.72; }
.panel-card {
  border: 1px solid var(--line);
  border-radius: 28px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  padding: 22px;
  margin-bottom: 18px;
}
.panel-header { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 16px; }
.panel-header h2 { margin: 0; font-size: 24px; font-family: 'Noto Sans SC', sans-serif; }
.panel-caption, .helper-text { color: var(--muted); font-size: 13px; }
.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; margin-bottom: 18px; }
.summary-card {
  padding: 18px;
  border-radius: 24px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(246,253,251,0.82));
  box-shadow: var(--shadow);
}
.summary-card .label { display:block; color:var(--muted); font-size:13px; margin-bottom:10px; }
.summary-card strong { display:block; font-size: clamp(24px, 3vw, 36px); line-height:1.05; }
.summary-card .sub { margin-top:8px; font-size:13px; color:var(--muted); }
.filter-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.filter-row label { font-size: 13px; color: var(--muted); font-weight: 700; }
select {
  min-width: 220px;
  border-radius: 16px;
  border: 1px solid rgba(93, 174, 160, 0.20);
  background: rgba(255,255,255,0.94);
  padding: 13px 14px;
  font: inherit;
  color: var(--text);
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 900px; }
th, td { padding: 16px 14px; text-align: left; border-bottom: 1px solid rgba(94,146,138,0.12); }
th { color: var(--muted); font-size: 13px; font-weight: 800; background: rgba(237,249,247,0.86); }
tr:last-child td { border-bottom: 0; }
.group-a-row td:first-child { border-left: 4px solid #63b6a6; }
.group-b-row td:first-child { border-left: 4px solid #7aa9dd; }
.group-total-row td:first-child { border-left: 4px solid #348779; }
.group-total-row td { background: rgba(93,174,160,0.09); font-weight: 700; }
.status-box {
  border-radius: 18px;
  padding: 16px 18px;
  background: rgba(232, 247, 244, 0.92);
  color: var(--accent-deep);
  font-size: 14px;
  line-height: 1.5;
}
@media (max-width: 980px) {
  .hero-panel, .summary-grid { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="hero-panel">
      <div class="hero-copy">
        <p class="eyebrow">Overseas Performance Board</p>
        <h1>总数据看板</h1>
        <p class="hero-text">这个总表只做一件事：自动读取 A组（北京）和 B组（广州）已经在线保存的数据，并做汇总展示。A/B 更新成功后，这里会自动显示最新结果。</p>
      </div>
      <div class="panel-card">
        <div class="panel-header">
          <div>
            <p class="panel-kicker">数据源</p>
            <h2>综合数据预览</h2>
          </div>
        </div>
        <div id="status" class="status-box">正在加载 A组和B组线上数据...</div>
      </div>
    </section>

    <section class="summary-grid" id="summary-grid"></section>

    <section class="panel-card">
      <div class="panel-header">
        <div>
          <p class="panel-kicker">筛选</p>
          <h2>日期筛选</h2>
        </div>
        <div class="panel-caption" id="date-caption"></div>
      </div>
      <div class="filter-row">
        <label for="date-filter">查看日期</label>
        <select id="date-filter"></select>
      </div>
    </section>

    <section class="panel-card">
      <div class="panel-header">
        <div>
          <p class="panel-kicker">分组回收</p>
          <h2>A组 / B组 / 总数据 + 美国 / 非美国</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>组别</th>
              <th>分类</th>
              <th>消耗</th>
              <th>补贴前 ROI</th>
            </tr>
          </thead>
          <tbody id="group-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel-card">
      <div class="panel-header">
        <div>
          <p class="panel-kicker">分日汇总</p>
          <h2>分日分组数据</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>A组消耗</th>
              <th>A组补贴前 ROI</th>
              <th>A组补贴后 ROI</th>
              <th>B组消耗</th>
              <th>B组补贴前 ROI</th>
              <th>B组补贴后 ROI</th>
              <th>总消耗</th>
              <th>总补贴前 ROI</th>
              <th>总补贴后 ROI</th>
            </tr>
          </thead>
          <tbody id="daily-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const SOURCES = [
      { key: 'a', label: 'A组（北京）', path: 'data/group-a' },
      { key: 'b', label: 'B组（广州）', path: 'data/group-b' },
    ];

    const state = {
      rows: [],
      selectedDate: '',
      availableDates: [],
    };

    const money = (value) => new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(value || 0));
    const pct = (value) => `${(Number(value || 0) * 100).toFixed(2)}%`;
    const safeDiv = (a, b) => (b ? a / b : 0);

    function expandRow(row, fallback) {
      const revenues = row.rr || row.revenues_raw || {};
      const spend = Number(row.s || row.spend || 0);
      return {
        group_key: row.g || row.group_key || fallback.key,
        group_label: row.gl || row.group_label || fallback.label,
        account: row.a || row.account || '-',
        country: row.c || row.country || '未标注',
        date: row.d || row.date || '',
        spend,
        overall_roas_raw: Number(row.or || row.overall_roas_raw || 0),
        overall_roas_post: Number(row.op || row.overall_roas_post || 0),
      };
    }

    async function fetchJson(url) {
      const response = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function loadGroupRows(source) {
      const index = await fetchJson(`${source.path}/index.json`);
      const dates = Array.isArray(index?.dates) ? index.dates : [];
      const payloads = await Promise.all(
        dates.map(async (date) => {
          try {
            return await fetchJson(`${source.path}/${date}.json`);
          } catch (error) {
            return [];
          }
        })
      );
      return payloads.flat().map((row) => expandRow(row, source)).filter((row) => row.date);
    }

    function summarize(rows) {
      const spend = rows.reduce((sum, row) => sum + Number(row.spend || 0), 0);
      const revenueRaw = rows.reduce((sum, row) => sum + Number(row.spend || 0) * Number(row.overall_roas_raw || 0), 0);
      const revenuePost = rows.reduce((sum, row) => sum + Number(row.spend || 0) * Number(row.overall_roas_post || 0), 0);
      return {
        spend,
        revenueRaw,
        revenuePost,
        roasRaw: safeDiv(revenueRaw, spend),
        roasPost: safeDiv(revenuePost, spend),
        countryCount: new Set(rows.map((row) => row.country)).size,
        accountCount: new Set(rows.map((row) => row.account)).size,
      };
    }

    function getPreferredDate(dates) {
      if (!dates.length) return '';
      const now = new Date();
      now.setDate(now.getDate() - 1);
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const yesterday = `${yyyy}-${mm}-${dd}`;
      return dates.includes(yesterday) ? yesterday : dates.at(-1);
    }

    function renderSummaryCards(rows, dates) {
      const total = summarize(selectedRows(rows));
      const activeDate = state.selectedDate || getPreferredDate(dates) || '-';
      const cards = [
        { label: '当前日期', value: activeDate, sub: `默认展示昨天；当前共 ${dates.length} 天历史` },
        { label: '总消耗', value: money(total.spend), sub: `${activeDate} 总消耗` },
        { label: '补贴前 ROI', value: pct(total.roasRaw), sub: `${activeDate} 总补贴前 ROI` },
        { label: '补贴后 ROI', value: pct(total.roasPost), sub: `${activeDate} 总补贴后 ROI` },
      ];
      document.getElementById('summary-grid').innerHTML = cards.map((card) => `
        <article class="summary-card">
          <span class="label">${card.label}</span>
          <strong>${card.value}</strong>
          <div class="sub">${card.sub}</div>
        </article>
      `).join('');
    }

    function renderDateFilter(dates) {
      const select = document.getElementById('date-filter');
      select.innerHTML = ['<option value="all">全部日期</option>']
        .concat(dates.map((date) => `<option value="${date}">${date}</option>`))
        .join('');
      select.value = state.selectedDate || getPreferredDate(dates);
      document.getElementById('date-caption').textContent = state.selectedDate === 'all'
        ? `当前已选：全部日期`
        : `当前已选：${state.selectedDate || getPreferredDate(dates)}`;
    }

    function selectedRows(rows) {
      if (state.selectedDate === 'all') return rows;
      const targetDate = state.selectedDate || getPreferredDate(state.availableDates);
      return rows.filter((row) => row.date === targetDate);
    }

    function renderGroupTable(rows) {
      const targetRows = selectedRows(rows);
      const body = document.getElementById('group-body');
      const sections = [
        { label: 'A组（北京）', className: 'group-a-row', rows: targetRows.filter((row) => row.group_key === 'a') },
        { label: 'B组（广州）', className: 'group-b-row', rows: targetRows.filter((row) => row.group_key === 'b') },
        { label: '总数据', className: 'group-total-row', rows: targetRows },
      ];
      const categories = [
        { label: '总数据', filter: (row) => true },
        { label: '美国', filter: (row) => row.country === '美国' },
        { label: '非美国', filter: (row) => row.country !== '美国' },
      ];
      body.innerHTML = sections.map((section) =>
        categories.map((category) => {
          const scoped = section.rows.filter(category.filter);
          const summary = summarize(scoped);
          return `<tr class="${section.className}">
            <td>${section.label}</td>
            <td>${category.label}</td>
            <td>${money(summary.spend)}</td>
            <td>${pct(summary.roasRaw)}</td>
          </tr>`;
        }).join('')
      ).join('');
    }

    function renderDailyTable(rows) {
      const dates = state.selectedDate === 'all'
        ? state.availableDates
        : [state.selectedDate === 'latest' ? state.availableDates.at(-1) : state.selectedDate].filter(Boolean);
      const body = document.getElementById('daily-body');
      body.innerHTML = dates.map((date) => {
        const aRows = rows.filter((row) => row.group_key === 'a' && row.date === date);
        const bRows = rows.filter((row) => row.group_key === 'b' && row.date === date);
        const tRows = rows.filter((row) => row.date === date);
        const a = summarize(aRows);
        const b = summarize(bRows);
        const t = summarize(tRows);
        return `<tr>
          <td>${date}</td>
          <td>${aRows.length ? money(a.spend) : '-'}</td>
          <td>${aRows.length ? pct(a.roasRaw) : '-'}</td>
          <td>${aRows.length ? pct(a.roasPost) : '-'}</td>
          <td>${bRows.length ? money(b.spend) : '-'}</td>
          <td>${bRows.length ? pct(b.roasRaw) : '-'}</td>
          <td>${bRows.length ? pct(b.roasPost) : '-'}</td>
          <td>${money(t.spend)}</td>
          <td>${pct(t.roasRaw)}</td>
          <td>${pct(t.roasPost)}</td>
        </tr>`;
      }).join('');
    }

    function renderAll() {
      renderSummaryCards(state.rows, state.availableDates);
      renderDateFilter(state.availableDates);
      renderGroupTable(state.rows);
      renderDailyTable(state.rows);
    }

    async function init() {
      try {
        const groups = await Promise.all(SOURCES.map((source) => loadGroupRows(source)));
        state.rows = groups.flat();
        state.availableDates = [...new Set(state.rows.map((row) => row.date))].sort();
        if (!state.availableDates.length) {
          document.getElementById('status').textContent = 'A组和B组当前都还没有线上数据';
          return;
        }
        state.selectedDate = getPreferredDate(state.availableDates);
        document.getElementById('status').textContent = `已载入 A组 ${groups[0].length} 条、B组 ${groups[1].length} 条线上数据；当前最新日期 ${state.availableDates.at(-1)}`;
        renderAll();
        document.getElementById('date-filter').addEventListener('change', (event) => {
          state.selectedDate = event.target.value;
          renderAll();
        });
      } catch (error) {
        document.getElementById('status').textContent = `总数据加载失败：${error.message || error}`;
      }
    }

    init();
  </script>
</body>
</html>
